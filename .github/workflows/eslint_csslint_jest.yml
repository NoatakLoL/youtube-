name: eslint, csslint, jest, npm test

on:
  push:
    branches:
      - master
      - 'feature/*'
      - ESlint
      - 'codex/**'
  pull_request:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      ESLINT_USE_FLAT_CONFIG: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --force

      - name: Run ESLint
        run: npx eslint .

      - name: Run Jest
        run: npx jest

      - name: Run npm test
        run: npm test
