name: Refactor lint and regression tests

on:
  push:
    branches:
      - master
      - 'feature/*'
      - ESlint
      - 'codex/**'
  pull_request:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      ESLINT_USE_FLAT_CONFIG: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --force

      - name: Full repository lint audit
        run: npm run lint
        continue-on-error: true

      - name: Lint newly refactored modules
        run: >-
          npx eslint --quiet
          "js&css/web-accessible/state/player-state-coordinator.js"
          "js&css/web-accessible/features/*.js"
          "menu/studio.js"
          "tests/unit/player-state-coordinator.test.js"
          "tests/unit/bookmarks.test.js"
          "tests/unit/capture.test.js"
          "tests/unit/playback-controls.test.js"
          "tests/unit/keybinds.test.js"
          "tests/unit/feature-scope.test.js"
          "tests/unit/audio-processing.test.js"

      - name: Run Jest regression suite
        run: npm test -- --runInBand
